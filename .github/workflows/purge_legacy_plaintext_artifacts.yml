name: Purge legacy plaintext artifacts

on:
  push:
    paths:
      - .github/workflows/purge_legacy_plaintext_artifacts.yml

permissions:
  actions: write
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Delete legacy plaintext artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for artifact_id in 9925480550 9953253973 9964743425 9964803069 9964856992 9964987986; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done
      - uses: actions/checkout@v4
      - name: Remove this one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/purge_legacy_plaintext_artifacts.yml
          git commit -m "chore: remove temporary artifact purge workflow"
          git push
